[package]
name = "bu-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bu-actor = { path = "../bu-actor" }
bu-agent = { path = "../bu-agent" }
bu-llm = { path = "../bu-llm" }
bu-mcp = { path = "../bu-mcp" }
tokio.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
live-chrome = ["bu-mcp/live-chrome"]
# Build the MCP binary with AWS Bedrock agent support (BROWSER_USE_LLM_API=bedrock).
bedrock = ["bu-mcp/bedrock"]

[[bin]]
name = "browser-use-rs"
path = "src/main.rs"
